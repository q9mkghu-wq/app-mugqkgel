<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>시스템행거장 배치 플래너</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; color: #333; }
  
  header {
    background: linear-gradient(135deg, #2c3e50, #3498db);
    color: white;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  }
  header h1 { font-size: 22px; font-weight: 700; }
  header span { font-size: 13px; opacity: 0.8; }

  .main-container {
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 0;
    height: calc(100vh - 60px);
  }

  /* 좌측 패널 */
  .left-panel {
    background: white;
    overflow-y: auto;
    border-right: 1px solid #e0e0e0;
    display: flex;
    flex-direction: column;
  }

  .section-title {
    background: #2c3e50;
    color: white;
    padding: 10px 16px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  /* 방 설정 */
  .room-settings {
    padding: 16px;
    border-bottom: 1px solid #eee;
  }
  .room-settings label {
    display: block;
    font-size: 12px;
    color: #666;
    margin-bottom: 4px;
    font-weight: 600;
  }
  .input-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 10px;
  }
  .input-group input {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid #ddd;
    border-radius: 6px;
    font-size: 14px;
    transition: border-color 0.2s;
  }
  .input-group input:focus { outline: none; border-color: #3498db; }
  .input-unit { font-size: 11px; color: #999; margin-top: 2px; }

  .btn-apply {
    width: 100%;
    padding: 9px;
    background: #3498db;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn-apply:hover { background: #2980b9; }

  /* 모듈 카탈로그 */
  .module-catalog { flex: 1; overflow-y: auto; }
  .category-block { border-bottom: 1px solid #eee; }
  .category-header {
    padding: 10px 16px;
    background: #f8f9fa;
    font-size: 12px;
    font-weight: 700;
    color: #555;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    user-select: none;
  }
  .category-header:hover { background: #e9ecef; }
  .category-header .arrow { transition: transform 0.2s; }
  .category-header.collapsed .arrow { transform: rotate(-90deg); }
  .module-list { display: none; padding: 8px; }
  .module-list.open { display: block; }

  .module-card {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    margin-bottom: 6px;
    cursor: pointer;
    transition: all 0.2s;
    background: white;
  }
  .module-card:hover { border-color: #3498db; background: #f0f8ff; }
  .module-icon {
    width: 40px;
    height: 40px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }
  .module-info { flex: 1; min-width: 0; }
  .module-name { font-size: 12px; font-weight: 700; color: #333; }
  .module-size { font-size: 11px; color: #888; margin-top: 1px; }
  .module-price { font-size: 11px; color: #e74c3c; font-weight: 600; }
  .btn-add-module {
    padding: 4px 10px;
    background: #27ae60;
    color: white;
    border: none;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn-add-module:hover { background: #219a52; }

  /* 우측 패널 */
  .right-panel {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .canvas-toolbar {
    background: white;
    border-bottom: 1px solid #e0e0e0;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .toolbar-group { display: flex; align-items: center; gap: 8px; }
  .toolbar-label { font-size: 12px; color: #666; font-weight: 600; }
  .btn-toolbar {
    padding: 6px 12px;
    border: 1px solid #ddd;
    border-radius: 5px;
    background: white;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-toolbar:hover { background: #f0f8ff; border-color: #3498db; color: #3498db; }
  .btn-toolbar.danger:hover { background: #fff0f0; border-color: #e74c3c; color: #e74c3c; }
  .btn-toolbar.primary {
    background: #3498db;
    color: white;
    border-color: #3498db;
  }
  .btn-toolbar.primary:hover { background: #2980b9; }

  .scale-info {
    margin-left: auto;
    font-size: 12px;
    color: #888;
    background: #f8f9fa;
    padding: 4px 10px;
    border-radius: 4px;
  }

  /* 캔버스 영역 */
  .canvas-area {
    flex: 1;
    overflow: auto;
    background: #e8e8e8;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #room-canvas-wrap {
    position: relative;
    background: white;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
  }

  #room-canvas { display: block; cursor: default; }

  /* 배치된 모듈 정보 패널 */
  .placed-panel {
    background: white;
    border-top: 1px solid #e0e0e0;
    max-height: 220px;
    overflow-y: auto;
  }
  .placed-header {
    padding: 8px 16px;
    background: #2c3e50;
    color: white;
    font-size: 12px;
    font-weight: 600;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .placed-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 10px 16px;
  }
  .placed-item {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 10px;
    border: 1px solid #e0e0e0;
    border-radius: 6px;
    font-size: 12px;
    background: #f9f9f9;
    cursor: pointer;
    transition: all 0.15s;
  }
  .placed-item:hover { border-color: #e74c3c; background: #fff0f0; }
  .placed-item.selected { border-color: #3498db; background: #e8f4fd; }
  .placed-item-dot {
    width: 10px; height: 10px;
    border-radius: 2px;
  }
  .placed-item-name { font-weight: 600; color: #333; }
  .placed-item-pos { color: #888; font-size: 11px; }
  .placed-item-del {
    color: #e74c3c;
    font-weight: 700;
    cursor: pointer;
    padding: 0 2px;
  }

  /* 합계 바 */
  .summary-bar {
    background: #2c3e50;
    color: white;
    padding: 8px 16px;
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    align-items: center;
    font-size: 12px;
  }
  .summary-item { display: flex; flex-direction: column; gap: 2px; }
  .summary-label { opacity: 0.7; font-size: 11px; }
  .summary-value { font-weight: 700; font-size: 14px; }
  .summary-total { margin-left: auto; }
  .summary-total .summary-value { font-size: 18px; color: #f1c40f; }

  /* 저장된 플랜 모달 */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 1000;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: white;
    border-radius: 12px;
    width: 600px;
    max-width: 95vw;
    max-height: 85vh;
    overflow-y: auto;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
  }
  .modal-header {
    padding: 16px 20px;
    border-bottom: 1px solid #eee;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .modal-header h2 { font-size: 18px; color: #2c3e50; }
  .modal-close {
    background: none;
    border: none;
    font-size: 22px;
    cursor: pointer;
    color: #888;
  }
  .modal-body { padding: 16px 20px; }
  .save-form { display: grid; gap: 12px; margin-bottom: 20px; }
  .save-form input, .save-form textarea {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid #ddd;
    border-radius: 6px;
    font-size: 13px;
  }
  .save-form textarea { height: 60px; resize: vertical; }
  .btn-save-plan {
    padding: 9px 20px;
    background: #27ae60;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-save-plan:hover { background: #219a52; }
  .plan-list { display: grid; gap: 10px; }
  .plan-card {
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    padding: 12px 14px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .plan-card:hover { border-color: #3498db; background: #f0f8ff; }
  .plan-card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
  .plan-card-name { font-weight: 700; font-size: 14px; }
  .plan-card-date { font-size: 11px; color: #888; }
  .plan-card-info { font-size: 12px; color: #666; }
  .plan-card-del {
    padding: 3px 8px;
    background: #e74c3c;
    color: white;
    border: none;
    border-radius: 4px;
    font-size: 11px;
    cursor: pointer;
  }

  /* 반응형 */
  @media (max-width: 768px) {
    .main-container { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .left-panel { max-height: 280px; }
  }

  .tooltip {
    position: absolute;
    background: rgba(0,0,0,0.8);
    color: white;
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 11px;
    pointer-events: none;
    z-index: 100;
    white-space: nowrap;
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>🏠 시스템행거장 배치 플래너</h1>
    <span>방 사이즈에 맞춰 모듈을 배치하고 견적을 확인하세요</span>
  </div>
</header>

<div class="main-container">
  <!-- 좌측 패널 -->
  <div class="left-panel">
    <div class="section-title">📐 방 크기 설정</div>
    <div class="room-settings">
      <div class="input-row">
        <div class="input-group">
          <label>방 가로 (폭)</label>
          <input type="number" id="room-width" value="300" min="100" max="2000" step="5">
          <div class="input-unit">단위: cm</div>
        </div>
        <div class="input-group">
          <label>방 세로 (깊이)</label>
          <input type="number" id="room-depth" value="250" min="100" max="2000" step="5">
          <div class="input-unit">단위: cm</div>
        </div>
      </div>
      <div class="input-row">
        <div class="input-group">
          <label>방 높이</label>
          <input type="number" id="room-height" value="240" min="180" max="400" step="5">
          <div class="input-unit">단위: cm</div>
        </div>
        <div class="input-group">
          <label>벽 설치 위치</label>
          <select id="wall-side" style="width:100%;padding:8px 10px;border:1px solid #ddd;border-radius:6px;font-size:13px;">
            <option value="top">위쪽 벽</option>
            <option value="bottom">아래쪽 벽</option>
            <option value="left">왼쪽 벽</option>
            <option value="right">오른쪽 벽</option>
          </select>
        </div>
      </div>
      <button class="btn-apply" onclick="applyRoomSettings()">방 크기 적용</button>
    </div>

    <div class="section-title">🛒 모듈 카탈로그</div>
    <div class="module-catalog" id="module-catalog"></div>
  </div>

  <!-- 우측 패널 -->
  <div class="right-panel">
    <div class="canvas-toolbar">
      <div class="toolbar-group">
        <span class="toolbar-label">도구:</span>
        <button class="btn-toolbar" onclick="setTool('select')" id="tool-select">⬆️ 선택/이동</button>
        <button class="btn-toolbar" onclick="setTool('delete')" id="tool-delete">🗑️ 삭제</button>
      </div>
      <div class="toolbar-group">
        <button class="btn-toolbar" onclick="clearAll()" style="color:#e74c3c;">🗑️ 전체 삭제</button>
        <button class="btn-toolbar" onclick="openSaveModal()">💾 저장/불러오기</button>
        <button class="btn-toolbar primary" onclick="printEstimate()">🖨️ 견적서 출력</button>
      </div>
      <div class="scale-info" id="scale-info">1cm = 2px</div>
    </div>

    <div class="canvas-area" id="canvas-area">
      <div id="room-canvas-wrap">
        <canvas id="room-canvas"></canvas>
      </div>
    </div>

    <div class="placed-panel">
      <div class="placed-header">
        <span>📦 배치된 모듈 목록</span>
        <span id="placed-count">0개 배치됨</span>
      </div>
      <div class="placed-list" id="placed-list"></div>
    </div>

    <div class="summary-bar">
      <div class="summary-item">
        <span class="summary-label">배치 수량</span>
        <span class="summary-value" id="sum-count">0개</span>
      </div>
      <div class="summary-item">
        <span class="summary-label">사용 폭</span>
        <span class="summary-value" id="sum-width">0 cm</span>
      </div>
      <div class="summary-item">
        <span class="summary-label">남은 공간</span>
        <span class="summary-value" id="sum-remain">0 cm</span>
      </div>
      <div class="summary-item summary-total">
        <span class="summary-label">총 견적 (VAT 별도)</span>
        <span class="summary-value" id="sum-price">₩0</span>
      </div>
    </div>
  </div>
</div>

<!-- 저장/불러오기 모달 -->
<div class="modal-overlay" id="save-modal">
  <div class="modal">
    <div class="modal-header">
      <h2>💾 플랜 저장 / 불러오기</h2>
      <button class="modal-close" onclick="closeSaveModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="save-form">
        <input type="text" id="plan-name" placeholder="플랜 이름 (예: 홍길동님 안방 플랜)">
        <input type="text" id="plan-customer" placeholder="고객명 / 연락처">
        <textarea id="plan-memo" placeholder="메모 (요청사항 등)"></textarea>
        <button class="btn-save-plan" onclick="savePlan()">💾 현재 플랜 저장</button>
      </div>
      <div class="section-title" style="margin-bottom:12px;">📋 저장된 플랜 목록</div>
      <div class="plan-list" id="plan-list"></div>
    </div>
  </div>
</div>

<div class="tooltip" id="tooltip" style="display:none;"></div>

<script>
// Firebase 초기화
const firebaseConfig = {"apiKey":"AIzaSyAA9XxN-Pw0vbLT0f8-mI2bV0FgEx18iIU","authDomain":"appbuilder-4e83c.firebaseapp.com","projectId":"appbuilder-4e83c","storageBucket":"appbuilder-4e83c.firebasestorage.app","messagingSenderId":"1038242551917","appId":"1:1038242551917:web:4d59995638762401dd0764"};

// ===================== 앱 상태 =====================
let roomW = 300, roomD = 250, roomH = 240;
let scale = 2; // 1cm = 2px
let placedModules = [];
let selectedId = null;
let tool = 'select';
let dragging = false;
let dragOffX = 0, dragOffY = 0;

let canvasW, canvasH;
let wallSide = 'top';

const canvas = document.getElementById('room-canvas');
const ctx = canvas.getContext('2d');

// ===================== 카탈로그 렌더 =====================
function renderCatalog() {
  const wrap = document.getElementById('module-catalog');
  wrap.innerHTML = '';
  MODULE_CATEGORIES.forEach((cat, ci) => {
    const block = document.createElement('div');
    block.className = 'category-block';
    const header = document.createElement('div');
    header.className = 'category-header';
    header.innerHTML = `<span>${cat.name}</span><span class="arrow">▼</span>`;
    header.onclick = () => {
      const list = block.querySelector('.module-list');
      list.classList.toggle('open');
      header.classList.toggle('collapsed');
    };
    const list = document.createElement('div');
    list.className = 'module-list open';
    cat.items.forEach(mod => {
      const card = document.createElement('div');
      card.className = 'module-card';
      card.innerHTML = `
        <div class="module-icon" style="background:${mod.color}22;border:1px solid ${mod.color}88;">${mod.icon}</div>
        <div class="module-info">
          <div class="module-name">${mod.name}</div>
          <div class="module-size">폭${mod.w}×높이${mod.h}×깊이${mod.d}cm</div>
          <div class="module-price">₩${mod.price.toLocaleString()}</div>
        </div>
        <button class="btn-add-module" onclick="addModule('${mod.id}')">+ 추가</button>
      `;
      list.appendChild(card);
    });
    block.appendChild(header);
    block.appendChild(list);
    wrap.appendChild(block);
  });
}

function findModuleById(id) {
  for (const cat of MODULE_CATEGORIES) {
    const found = cat.items.find(i => i.id === id);
    if (found) return found;
  }
  return null;
}

// ===================== 방 설정 =====================
function applyRoomSettings() {
  roomW = parseInt(document.getElementById('room-width').value) || 300;
  roomD = parseInt(document.getElementById('room-depth').value) || 250;
  roomH = parseInt(document.getElementById('room-height').value) || 240;
  wallSide = document.getElementById('wall-side').value;
  calcScale();
  drawRoom();
  updateSummary();
}

function calcScale() {
  const area = document.getElementById('canvas-area');
  const aW = area.clientWidth - 60;
  const aH = area.clientHeight - 60;
  const sW = aW / roomW;
  const sH = aH / roomD;
  scale = Math.min(sW, sH, 3);
  scale = Math.max(scale, 0.5);
  document.getElementById('scale-info').textContent = `1cm = ${scale.toFixed(1)}px`;
}

// ===================== 모듈 추가 =====================
function addModule(modId) {
  const mod = findModuleById(modId);
  if (!mod) return;
  
  // 기본 배치 위치 (벽 기준)
  let px = 0, py = 0;
  if (wallSide === 'top') { px = 10; py = 0; }
  else if (wallSide === 'bottom') { px = 10; py = roomD - mod.d; }
  else if (wallSide === 'left') { px = 0; py = 10; }
  else if (wallSide === 'right') { px = roomW - mod.d; py = 10; }

  const placed = {
    uid: 'mod_' + (idCounter++),
    modId: mod.id,
    x: px,
    y: py,
    w: wallSide === 'left' || wallSide === 'right' ? mod.d : mod.w,
    d: wallSide === 'left' || wallSide === 'right' ? mod.w : mod.d,
    mod: mod,
  };
  placedModules.push(placed);
  selectedId = placed.uid;
  drawRoom();
  updateSummary();
  updatePlacedList();
}

// ===================== 캔버스 그리기 =====================
function drawRoom() {
  canvasW = Math.round(roomW * scale);
  canvasH = Math.round(roomD * scale);
  canvas.width = canvasW;
  canvas.height = canvasH;
  document.getElementById('room-canvas-wrap').style.width = canvasW + 'px';
  document.getElementById('room-canvas-wrap').style.height = canvasH + 'px';

  ctx.clearRect(0, 0, canvasW, canvasH);

  // 방 바닥
  ctx.fillStyle = '#fafafa';
  ctx.fillRect(0, 0, canvasW, canvasH);

  // 그리드
  ctx.strokeStyle = '#e8e8e8';
  ctx.lineWidth = 0.5;
  const gridStep = 10 * scale; // 10cm 단위
  for (let x = 0; x <= canvasW; x += gridStep) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvasH); ctx.stroke();
  }
  for (let y = 0; y <= canvasH; y += gridStep) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvasW, y); ctx.stroke();
  }

  // 50cm 단위 굵은 선
  ctx.strokeStyle = '#d0d0d0';
  ctx.lineWidth = 1;
  const grid50 = 50 * scale;
  for (let x = 0; x <= canvasW; x += grid50) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvasH); ctx.stroke();
  }
  for (let y = 0; y <= canvasH; y += grid50) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvasW, y); ctx.stroke();
  }

  // 벽 표시
  ctx.fillStyle = '#5d7a8a';
  const wallThick = 8;
  if (wallSide === 'top') {
    ctx.fillRect(0, 0, canvasW, wallThick);
    ctx.fillStyle = '#a0c0d0';
    ctx.fillRect(0, wallThick, canvasW, 3);
  } else if (wallSide === 'bottom') {
    ctx.fillRect(0, canvasH - wallThick, canvasW, wallThick);
    ctx.fillStyle = '#a0c0d0';
    ctx.fillRect(0, canvasH - wallThick - 3, canvasW, 3);
  } else if (wallSide === 'left') {
    ctx.fillRect(0, 0, wallThick, canvasH);
    ctx.fillStyle = '#a0c0d0';
    ctx.fillRect(wallThick, 0, 3, canvasH);
  } else if (wallSide === 'right') {
    ctx.fillRect(canvasW - wallThick, 0, wallThick, canvasH);
    ctx.fillStyle = '#a0c0d0';
    ctx.fillRect(canvasW - wallThick - 3, 0, 3, canvasH);
  }

  // 벽 라벨
  ctx.fillStyle = 'white';
  ctx.font = `bold ${Math.max(10, scale * 4)}px sans-serif`;
  ctx.textAlign = 'center';
  if (wallSide === 'top') ctx.fillText('▲ 벽', canvasW/2, 14);
  else if (wallSide === 'bottom') ctx.fillText('▼ 벽', canvasW/2, canvasH - 2);

  // 방 테두리
  ctx.strokeStyle = '#2c3e50';
  ctx.lineWidth = 3;
  ctx.strokeRect(1, 1, canvasW - 2, canvasH - 2);

  // 치수 표시
  ctx.strokeStyle = '#3498db';
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 3]);
  // 상단 치수
  ctx.beginPath(); ctx.moveTo(0, -20); ctx.lineTo(canvasW, -20); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#3498db';
  ctx.font = `bold 12px sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillText(`방 가로: ${roomW}cm`, canvasW/2, canvasH/2);

  // 모듈 그리기
  placedModules.forEach(pm => {
    drawModule(pm);
  });

  // 치수 텍스트
  ctx.fillStyle = 'rgba(52,152,219,0.15)';
  // 방 크기 중앙 표시 (모듈 없을 때)
  if (placedModules.length === 0) {
    ctx.fillStyle = '#3498db';
    ctx.font = `bold ${Math.min(20, scale*8)}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText(`${roomW} × ${roomD} cm`, canvasW/2, canvasH/2);
    ctx.font = `${Math.min(13, scale*5)}px sans-serif`;
    ctx.fillStyle = '#999';
    ctx.fillText('왼쪽 카탈로그에서 모듈을 추가하세요', canvasW/2, canvasH/2 + 30);
  }
}

function drawModule(pm) {
  const x = pm.x * scale;
  const y = pm.y * scale;
  const w = pm.w * scale;
  const h = pm.d * scale;
  const isSelected = pm.uid === selectedId;
  const mod = pm.mod;

  // 그림자
  ctx.shadowColor = 'rgba(0,0,0,0.15)';
  ctx.shadowBlur = isSelected ? 8 : 4;
  ctx.shadowOffsetX = 2;
  ctx.shadowOffsetY = 2;

  // 본체
  ctx.fillStyle = mod.color + 'cc';
  ctx.fillRect(x, y, w, h);
  ctx.shadowColor = 'transparent';
  ctx.shadowBlur = 0;
  ctx.shadowOffsetX = 0;
  ctx.shadowOffsetY = 0;

  // 테두리
  ctx.strokeStyle = isSelected ? '#e74c3c' : mod.color;
  ctx.lineWidth = isSelected ? 2.5 : 1.5;
  ctx.strokeRect(x, y, w, h);

  // 패턴 (내부 디테일)
  ctx.strokeStyle = mod.color + '66';
  ctx.lineWidth = 0.5;
  if (mod.id.startsWith('hanger')) {
    // 행거봉 표시
    const barY = y + h * 0.3;
    ctx.beginPath(); ctx.moveTo(x + 4, barY); ctx.lineTo(x + w - 4, barY); ctx.stroke();
    // 옷 아이콘들
    for (let i = 0; i < Math.floor(pm.w / 15); i++) {
      const hx = x + 10 + i * 15;
      ctx.beginPath();
      ctx.moveTo(hx, barY);
      ctx.lineTo(hx - 5, barY + h*0.3);
      ctx.lineTo(hx + 5, barY + h*0.3);
      ctx.closePath();
      ctx.stroke();
    }
  } else if (mod.id.startsWith('drawer') || mod.id.startsWith('cabinet')) {
    // 서랍 라인
    const drawers = mod.id.includes('5') ? 5 : mod.id.includes('3') ? 3 : 2;
    for (let i = 1; i < drawers; i++) {
      const ly = y + (h / drawers) * i;
      ctx.beginPath(); ctx.moveTo(x + 4, ly); ctx.lineTo(x + w - 4, ly); ctx.stroke();
    }
    // 손잡이
    for (let i = 0; i < drawers; i++) {
      const handleY = y + (h / drawers) * i + h / drawers / 2;
      ctx.fillStyle = mod.color;
      ctx.fillRect(x + w/2 - 8, handleY - 2, 16, 4);
    }
  } else if (mod.id.startsWith('shelf')) {
    // 선반 선
    ctx.beginPath(); ctx.moveTo(x, y + h/2); ctx.lineTo(x + w, y + h/2); ctx.stroke();
  }

  // 선택 핸들
  if (isSelected) {
    ctx.fillStyle = '#e74c3c';
    const hSize = 6;
    [[0,0],[w,0],[0,h],[w,h],[w/2,0],[w/2,h],[0,h/2],[w,h/2]].forEach(([hx,hy]) => {
      ctx.fillRect(x + hx - hSize/2, y + hy - hSize/2, hSize, hSize);
    });
  }

  // 라벨
  const fontSize = Math.max(9, Math.min(13, w/10));
  ctx.fillStyle = '#333';
  ctx.font = `bold ${fontSize}px sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const labelText = mod.icon + ' ' + (pm.w) + 'cm';
  if (w > 40 && h > 20) {
    ctx.fillText(labelText, x + w/2, y + h/2);
    if (h > 40) {
      ctx.font = `${fontSize - 2}px sans-serif`;
      ctx.fillStyle = '#555';
      ctx.fillText(mod.name.length > 8 ? mod.name.substring(0,8)+'…' : mod.name, x + w/2, y + h/2 + fontSize + 2);
    }
  }
  ctx.textBaseline = 'alphabetic';
}

// ===================== 캔버스 이벤트 =====================
function getMousePos(e) {
  const rect = canvas.getBoundingClientRect();
  const touch = e.touches ? e.touches[0] : e;
  return {
    x: (touch.clientX - rect.left),
    y: (touch.clientY - rect.top)
  };
}

function findModuleAt(x, y) {
  for (let i = placedModules.length - 1; i >= 0; i--) {
    const pm = placedModules[i];
    const px = pm.x * scale, py = pm.y * scale;
    const pw = pm.w * scale, ph = pm.d * scale;
    if (x >= px && x <= px + pw && y >= py && y <= py + ph) {
      return pm;
    }
  }
  return null;
}

canvas.addEventListener('mousedown', (e) => {
  const pos = getMousePos(e);
  const pm = findModuleAt(pos.x, pos.y);
  if (tool === 'delete') {
    if (pm) {
      placedModules = placedModules.filter(m => m.uid !== pm.uid);
      selectedId = null;
      drawRoom();
      updateSummary();
      updatePlacedList();
    }
    return;
  }
  if (pm) {
    selectedId = pm.uid;
    dragging = true;
    dragTarget = pm;
    dragOffX = pos.x - pm.x * scale;
    dragOffY = pos.y - pm.y * scale;
    drawRoom();
    updatePlacedList();
  } else {
    selectedId = null;
    drawRoom();
    updatePlacedList();
  }
});

canvas.addEventListener('mousemove', (e) => {
  const pos = getMousePos(e);
  if (dragging && dragTarget) {
    let nx = (pos.x - dragOffX) / scale;
    let ny = (pos.y - dragOffY) / scale;
    // 스냅 5cm
    nx = Math.round(nx / 5) * 5;
    ny = Math.round(ny / 5) * 5;
    // 경계 제한
    nx = Math.max(0, Math.min(roomW - dragTarget.w, nx));
    ny = Math.max(0, Math.min(roomD - dragTarget.d, ny));
    dragTarget.x = nx;
    dragTarget.y = ny;
    drawRoom();
    updateSummary();
    updatePlacedList();
    
    // 툴팁
    const tooltip = document.getElementById('tooltip');
    tooltip.style.display = 'block';
    tooltip.style.left = (e.clientX + 12) + 'px';
    tooltip.style.top = (e.clientY - 20) + 'px';
    tooltip.textContent = `X: ${nx}cm, Y: ${ny}cm`;
  } else {
    const hov = findModuleAt(pos.x, pos.y);
    canvas.style.cursor = hov ? (tool === 'delete' ? 'not-allowed' : 'grab') : 'default';
    document.getElementById('tooltip').style.display = 'none';
  }
});

canvas.addEventListener('mouseup', () => {
  dragging = false;
  dragTarget = null;
  canvas.style.cursor = 'default';
  document.getElementById('tooltip').style.display = 'none';
});

canvas.addEventListener('mouseleave', () => {
  dragging = false;
  document.getElementById('tooltip').style.display = 'none';
});

// ===================== 도구 =====================
function setTool(t) {
  tool = t;
  document.getElementById('tool-select').style.background = t === 'select' ? '#e8f4fd' : '';
  document.getElementById('tool-select').style.borderColor = t === 'select' ? '#3498db' : '';
  document.getElementById('tool-delete').style.background = t === 'delete' ? '#fff0f0' : '';
  document.getElementById('tool-delete').style.borderColor = t === 'delete' ? '#e74c3c' : '';
  canvas.style.cursor = t === 'delete' ? 'crosshair' : 'default';
}

function clearAll() {
  if (placedModules.length === 0) return;
  if (!confirm('배치된 모든 모듈을 삭제하시겠습니까?')) return;
  placedModules = [];
  selectedId = null;
  drawRoom();
  updateSummary();
  updatePlacedList();
}

// ===================== 요약 =====================
function updateSummary() {
  const count = placedModules.length;
  const totalPrice = placedModules.reduce((s, pm) => s + pm.mod.price, 0);
  
  // 선택된 벽 방향의 총 폭 계산
  let usedWidth = 0;
  if (wallSide === 'top' || wallSide === 'bottom') {
    usedWidth = placedModules.reduce((s, pm) => s + pm.w, 0);
  } else {
    usedWidth = placedModules.reduce((s, pm) => s + pm.d, 0);
  }
  const wallWidth = (wallSide === 'top' || wallSide === 'bottom') ? roomW : roomD;
  const remain = wallWidth - usedWidth;

  document.getElementById('sum-count').textContent = count + '개';
  document.getElementById('sum-width').textContent = usedWidth + ' cm';
  document.getElementById('sum-remain').textContent = remain + ' cm';
  document.getElementById('sum-price').textContent = '₩' + totalPrice.toLocaleString();
  document.getElementById('placed-count').textContent = count + '개 배치됨';
}

function updatePlacedList() {
  const list = document.getElementById('placed-list');
  list.innerHTML = '';
  if (placedModules.length === 0) {
    list.innerHTML = '<div style="color:#aaa;font-size:12px;padding:4px;">배치된 모듈이 없습니다. 왼쪽에서 모듈을 추가하세요.</div>';
    return;
  }
  placedModules.forEach((pm, i) => {
    const item = document.createElement('div');
    item.className = 'placed-item' + (pm.uid === selectedId ? ' selected' : '');
    item.innerHTML = `
      <div class="placed-item-dot" style="background:${pm.mod.color};"></div>
      <span class="placed-item-name">${pm.mod.icon} ${pm.mod.name}</span>
      <span class="placed-item-pos">(${pm.x},${pm.y})</span>
      <span class="placed-item-del" onclick="removeModule('${pm.uid}',event)">✕</span>
    `;
    item.addEventListener('click', () => {
      selectedId = pm.uid;
      drawRoom();
      updatePlacedList();
    });
    list.appendChild(item);
  });
}

function removeModule(uid, e) {
  e.stopPropagation();
  placedModules = placedModules.filter(m => m.uid !== uid);
  if (selectedId === uid) selectedId = null;
  drawRoom();
  updateSummary();
  updatePlacedList();
}

// ===================== 저장/불러오기 =====================
function openSaveModal() {
  document.getElementById('save-modal').classList.add('open');
  loadPlanList();
}
function closeSaveModal() {
  document.getElementById('save-modal').classList.remove('open');
}

function savePlan() {
  const name = document.getElementById('plan-name').value.trim();
  const customer = document.getElementById('plan-customer').value.trim();
  const memo = document.getElementById('plan-memo').value.trim();
  if (!name) { alert('플랜 이름을 입력해주세요.'); return; }

  const data = {
    name, customer, memo,
    roomW, roomD, roomH, wallSide,
    modules: placedModules.map(pm => ({
      modId: pm.modId,
      x: pm.x,
      y: pm.y,
      w: pm.w,
      d: pm.d,
    })),
    totalPrice: placedModules.reduce((s, pm) => s + pm.mod.price, 0),
    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
  };

  db.collection("apps/app-mugqkgel/items").add(data).then(() => {
    alert('플랜이 저장되었습니다!');
    document.getElementById('plan-name').value = '';
    document.getElementById('plan-customer').value = '';
    document.getElementById('plan-memo').value = '';
    loadPlanList();
  }).catch(err => {
    alert('저장 실패: ' + err.message);
  });
}

function loadPlanList() {
  const list = document.getElementById('plan-list');
  list.innerHTML = '<div style="color:#999;font-size:12px;">로딩 중...</div>';
  
  db.collection("apps/app-mugqkgel/items").orderBy('createdAt', 'desc').get().then(snap => {
    list.innerHTML = '';
    if (snap.empty) {
      list.innerHTML = '<div style="color:#aaa;font-size:13px;">저장된 플랜이 없습니다.</div>';
      return;
    }
    snap.forEach(doc => {
      const d = doc.data();
      const card = document.createElement('div');
      card.className = 'plan-card';
      const dateStr = d.createdAt ? new Date(d.createdAt.toDate()).toLocaleDateString('ko-KR') : '';
      card.innerHTML = `
        <div class="plan-card-header">
          <div>
            <div class="plan-card-name">${d.name}</div>
            <div class="plan-card-date">${d.customer ? d.customer + ' | ' : ''}${dateStr}</div>
          </div>
          <button class="plan-card-del" onclick="deletePlan('${doc.id}',event)">삭제</button>
        </div>
        <div class="plan-card-info">
          방: ${d.roomW}×${d.roomD}cm | 모듈: ${d.modules ? d.modules.length : 0}개 | 
          견적: ₩${(d.totalPrice||0).toLocaleString()}
          ${d.memo ? '<br>메모: ' + d.memo : ''}
        </div>
      `;
      card.querySelector('.plan-card-header > div').addEventListener('click', () => loadPlan(d));
      list.appendChild(card);
    });
  }).catch(err => {
    list.innerHTML = '<div style="color:#e74c3c;font-size:12px;">불러오기 실패: ' + err.message + '</div>';
  });
}

function loadPlan(d) {
  if (!confirm(`"${d.name}" 플랜을 불러오시겠습니까?\n현재 작업이 초기화됩니다.`)) return;
  roomW = d.roomW; roomD = d.roomD; roomH = d.roomH || 240;
  wallSide = d.wallSide || 'top';
  document.getElementById('room-width').value = roomW;
  document.getElementById('room-depth').value = roomD;
  document.getElementById('room-height').value = roomH;
  document.getElementById('wall-side').value = wallSide;
  
  placedModules = [];
  idCounter = 1;
  if (d.modules) {
    d.modules.forEach(pm => {
      const mod = findModuleById(pm.modId);
      if (mod) {
        placedModules.push({
          uid: 'mod_' + (idCounter++),
          modId: pm.modId,
          x: pm.x, y: pm.y,
          w: pm.w, d: pm.d,
          mod: mod,
        });
      }
    });
  }
  selectedId = null;
  calcScale();
  drawRoom();
  updateSummary();
  updatePlacedList();
  closeSaveModal();
  alert(`"${d.name}" 플랜을 불러왔습니다.`);
}

function deletePlan(id, e) {
  e.stopPropagation();
  if (!confirm('이 플랜을 삭제하시겠습니까?')) return;
  db.collection("apps/app-mugqkgel/items").doc(id).delete().then(() => {
    loadPlanList();
  });
}

      .total { text-align: right; font-size: 20px; font-weight: 700; color: #e74c3c; padding: 16px; background: #fff3cd; border-radius: 8px; margin-top: 20px; }
      .footer { text-align: center; color: #aaa; font-size: 12px; margin-top: 40px; }
    </style>
    </head><body>
    <h1>🏠 시스템행거장 배치 견적서</h1>
    <div class="info">
      <div class="info-item"><label>견적 일자</label><span>${new Date().toLocaleDateString('ko-KR')}</span></div>
      <div class="info-item"><label>방 크기</label><span>${roomW}(가로) × ${roomD}(세로) × ${roomH}(높이) cm</span></div>
      <div class="info-item"><label>총 모듈 수</label><span>${placedModules.length}개</span></div>
      <div class="info-item"><label>설치 벽 위치</label><span>${{top:'위쪽',bottom:'아래쪽',left:'왼쪽',right:'오른쪽'}[wallSide]} 벽</span></div>
    </div>
    <table>
      <thead><tr><th>모듈명</th><th>규격</th><th>수량</th><th>단가</th><th>소계</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="5" style="text-align:center;color:#aaa;">배치된 모듈 없음</td></tr>'}</tbody>
    </table>
    <div class="total">총 견적 금액: ₩${totalPrice.toLocaleString()} (VAT 별도)</div>
    <p style="color:#888;font-size:12px;margin-top:8px;">* 위 금액은 모듈 제품 기준이며, 설치비는 별도입니다.</p>
    <div class="footer">시스템행거장 온라인 플래너 | 본 견적서는 참고용입니다.</div>
    <script>window.print();<\/script>
    </body></html>
  `);
}
