<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>드레스룸 배치 플래너</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--paper:#ECEDEB;--sheet:#F8F8F6;--ink:#232529;--ink2:#5E6268;--rule:#CACCC9;--grid:#DEDFDC;--room:#FFFFFF;
--accent:#1F5FD1;--accent-soft:rgba(31,95,209,.10);--warn:#C8372D;--warn-soft:rgba(200,55,45,.12);
font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#16171A;--sheet:#1F2125;--ink:#E7E8E6;--ink2:#A3A7AC;--rule:#3A3D43;--grid:#2A2D32;--room:#24272C;--accent:#79A3F2;--accent-soft:rgba(121,163,242,.14);--warn:#F0776C;--warn-soft:rgba(240,119,108,.16)}}
:root[data-theme="dark"]{--paper:#16171A;--sheet:#1F2125;--ink:#E7E8E6;--ink2:#A3A7AC;--rule:#3A3D43;--grid:#2A2D32;--room:#24272C;--accent:#79A3F2;--accent-soft:rgba(121,163,242,.14);--warn:#F0776C;--warn-soft:rgba(240,119,108,.16)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:hidden}
body{margin:0;background:var(--paper);color:var(--ink);font-size:14px;line-height:1.5;overflow-x:hidden;max-width:100vw}
#three canvas{display:block;width:100%!important;height:100%!important}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;padding:12px 20px;border-bottom:1px solid var(--rule);background:var(--sheet)}
.top-l{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;min-width:0}
h1{font-size:20px;font-weight:600;letter-spacing:-.015em;margin:0;white-space:nowrap}
.top p{margin:0;color:var(--ink2);font-size:13px}
.tools{display:flex;gap:8px}
.bar{background:var(--sheet);border-bottom:1px solid var(--rule);padding:0 20px}
.bar-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;padding:10px 0}
.bar-row+.bar-row{border-top:1px dashed var(--rule)}
.grp{display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-width:0}
.grp.grow{flex:1 1 320px}
.grp>b{font-size:14px;font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:7px}
.n{width:20px;height:20px;border:1.5px solid var(--ink);border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:600;flex:none}
.sep{width:1px;align-self:stretch;background:var(--rule)}
.lbl{font-size:12.5px;color:var(--ink2);white-space:nowrap}
.inl{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--ink2)}
.inl input{font:inherit;font-size:15px;color:var(--ink);background:var(--room);border:1px solid var(--rule);border-radius:5px;padding:5px 8px;width:84px}
.err{color:var(--warn);font-size:12.5px}
.err:empty{display:none}
.swatches{display:flex;flex-wrap:wrap;gap:5px}
.sw{display:flex;align-items:center;gap:5px;font:inherit;font-size:12.5px;padding:4px 9px 4px 5px;border:1px solid var(--rule);border-radius:20px;background:var(--sheet);color:var(--ink);cursor:pointer;white-space:nowrap}
.sw i{width:15px;height:15px;border-radius:50%;border:1px solid rgba(0,0,0,.25);display:block}
.sw[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
select{font:inherit;font-size:13px;color:var(--ink);background:var(--room);border:1px solid var(--rule);border-radius:5px;padding:6px 8px;flex:1 1 220px;min-width:0;max-width:560px}
#catalog{flex:1 1 600px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px;min-width:0}
.cat{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;align-items:center;padding:6px 8px;border:1px solid var(--rule);border-radius:5px;background:var(--room)}
.cat svg{width:22px;height:32px}
.cat b{font-weight:600;font-size:13px;display:block;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat small{display:none}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.chip{font:inherit;font-size:12px;padding:2px 7px;border:1px solid var(--rule);border-radius:4px;background:var(--sheet);color:var(--ink);cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.check{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--ink2);white-space:nowrap}
main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;padding:14px 20px 24px}
.views{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px;min-width:0}
.pane{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.pane-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--rule);font-size:13px;font-weight:600;flex-wrap:wrap}
.pane-h span{font-weight:400;color:var(--ink2);font-size:12.5px}
#plan,#three{height:clamp(380px,calc(100vh - 315px),760px)}
#plan{width:100%;display:block;touch-action:none;background:var(--paper);user-select:none}
#three{touch-action:none;cursor:grab;background:var(--paper);position:relative}
.below{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:14px 16px}
h3{font-size:13.5px;font-weight:600;margin:0 0 10px}
.muted{color:var(--ink2);font-size:13px}
.btn{font:inherit;font-size:13px;padding:6px 11px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:5px;cursor:pointer;line-height:1.3;white-space:nowrap}
.btn:hover{border-color:var(--ink2)}
.btn.primary{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.btn.danger{color:var(--warn)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.field{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink2);min-width:0}
.field input{font:inherit;font-size:15px;color:var(--ink);background:var(--room);border:1px solid var(--rule);border-radius:5px;padding:7px 9px;width:100%}
.parts{list-style:none;margin:0;padding:0}
.parts li{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--rule);font-size:13px}
.parts li:last-child{border-bottom:0}
.pos{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.status{font-size:12.5px;margin-top:8px}
.status.bad{color:var(--warn)}
.status.ok{color:var(--ink2)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--sheet);font-size:13px;padding:8px 14px;border-radius:5px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
#toast.on{opacity:1}
kbd{font:inherit;font-size:11.5px;border:1px solid var(--rule);border-bottom-width:2px;border-radius:3px;padding:0 4px}
[hidden]{display:none!important}
.admin{background:var(--sheet);border-bottom:1px solid var(--rule);padding:14px 20px}
.admin-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-bottom:10px}
.admin-h h3{margin:0;font-size:15px}
.admin-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.prow{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--rule);border-radius:5px;padding:6px 10px;background:var(--room);font-size:13px}
.prow input{width:112px;text-align:right;font:inherit;font-size:15px;color:var(--ink);background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:4px 6px}
.prow input[aria-invalid="true"]{border-color:var(--warn)}
.admin-f{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:8px;margin-top:12px}
.admin-f .err{margin-right:auto}
@media (max-width:1400px){main{grid-template-columns:minmax(0,1fr)}.below{display:grid;grid-template-columns:1fr 1fr}#plan,#three{height:clamp(380px,calc(100vh - 300px),640px)}}
@media (max-width:1100px){.views{grid-template-columns:minmax(0,1fr)}.sep{display:none}}
@media (max-width:820px){.top{padding:12px 16px}.top p{display:none}h1{font-size:19px}.bar{padding:0 14px}.grp,.grp.grow{flex:1 1 100%}
 main{padding:12px 12px 24px}.below{grid-template-columns:1fr}#plan{height:62vw;min-height:280px;max-height:420px}#three{height:70vw;min-height:300px;max-height:440px}
 .inl input,select{font-size:16px}.field input{font-size:16px}.cat small{display:block;color:var(--ink2);font-size:11.5px}#catalog{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
<script id="price-data" type="application/json">{"hang1-800": 84500, "hang1-1000": 98500, "hang1-1200": 112500, "hang2-800": 91600, "hang2-1000": 106900, "hang2-1200": 122300, "hangShelf-800": 108000, "drawer3-800": 153300, "shelf5-800": 113300, "shelf5-400": 88700, "mirror-800": 149900, "corner-0": 128400}</script>
</head>
<body>
<header class="top">
  <div class="top-l">
    <h1>드레스룸 배치 플래너</h1>
    <p>모듈 폭은 실제 치수(표기 폭 + 6mm), 깊이는 40cm로 계산해요.</p>
  </div>
  <div class="tools">
    <button class="btn" id="undoBtn" title="Ctrl+Z">되돌리기</button>
    <button class="btn" id="adminBtn" hidden>단가 관리</button>
    <button class="btn danger" id="clearBtn">모두 지우기</button>
  </div>
</header>

<div class="bar">
  <div class="bar-row">
    <div class="grp">
      <b><span class="n">1</span>방 크기</b>
      <label class="inl">가로<input id="roomW" type="number" inputmode="decimal" min="50" max="2000" step="0.1" aria-label="방 가로 cm"></label>
      <label class="inl">세로<input id="roomD" type="number" inputmode="decimal" min="50" max="2000" step="0.1" aria-label="방 세로 cm"></label>
      <span class="lbl">cm</span>
      <button class="btn primary" id="roomApply">적용</button>
      <span class="err" id="roomErr" role="alert"></span>
    </div>
    <span class="sep"></span>
    <div class="grp">
      <b><span class="n">2</span>색상</b>
      <span class="lbl">프레임</span><div class="swatches" id="pillarSw"></div>
      <span class="lbl">선반</span><div class="swatches" id="shelfSw"></div>
    </div>
    <span class="sep"></span>
    <div class="grp grow">
      <b>세트</b>
      <select id="setSel" aria-label="세트 선택"></select>
      <button class="btn" id="setBtn" title="현재 배치를 세트로 바꿔요. 코너 세트는 왼쪽 벽까지 이어져요.">세트로 배치</button>
    </div>
  </div>
  <div class="bar-row">
    <div class="grp"><b><span class="n">3</span>모듈 추가</b></div>
    <div id="catalog"></div>
    <label class="check"><input type="checkbox" id="autoRot" checked> 벽에 끌면 자동 회전</label>
  </div>
</div>

<section class="admin" id="adminPanel" hidden aria-labelledby="adminTitle">
  <div class="admin-h"><h3 id="adminTitle">단가 관리</h3><span class="muted" id="adminNote"></span></div>
  <div class="admin-grid" id="priceRows"></div>
  <div class="admin-f">
    <span class="err" id="adminErr" role="alert"></span>
    <button class="btn" id="adminReset">기본 단가로</button>
    <button class="btn" id="adminCopy" hidden>JSON 복사</button>
    <button class="btn" id="adminClose">닫기</button>
    <button class="btn primary" id="adminSave">저장</button>
  </div>
</section>

<main>
  <div class="views">
    <div class="pane">
      <div class="pane-h">평면도<span>끌어서 이동, <kbd>R</kbd> 회전, <kbd>Del</kbd> 삭제</span></div>
      <svg id="plan" role="img" aria-label="방 평면도와 배치된 모듈"><g id="planG"></g></svg>
    </div>
    <div class="pane">
      <div class="pane-h">3D 미리보기<span style="display:flex;gap:8px;align-items:center">3D에서도 끌 수 있어요 <button class="btn" id="camReset" style="padding:3px 9px;font-size:12px">시점 초기화</button></span></div>
      <div id="three"></div>
    </div>
  </div>
  <div class="below">
    <div class="card" id="selPanel"></div>
    <div class="card"><h3>구성 목록</h3><div id="parts"></div></div>
  </div>
</main>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const DEPTH=400, EXTRA=6, CORNER=600, MOD_H=2000, WALL_H=2400, KEY='dressroom-planner-v1';
const PILLAR={black:{name:'블랙',hex:'#2B2C2F'},white:{name:'화이트',hex:'#EFEFEC'}};
const SHELF={oak:{name:'라이트오크',hex:'#D5B68C'},white:{name:'화이트',hex:'#F2F0EB'},beige:{name:'웜베이지',hex:'#E4D3BC'},pink:{name:'베이비핑크',hex:'#F1D2D4'}};
const TYPES={
  hang2:{name:'2단행거장',widths:[800,1000,1200],desc:'위·아래 행거봉 + 중간 선반'},
  hang1:{name:'1단행거장',widths:[800,1000,1200],desc:'긴 옷 행거봉 + 하부 선반'},
  hangShelf:{name:'행거선반장',widths:[800],desc:'행거봉 + 선반 2칸'},
  drawer3:{name:'3단서랍장',widths:[800],desc:'서랍 3단 + 상부 행거봉'},
  shelf5:{name:'5단선반장',widths:[400,800],desc:'오픈 선반 5단'},
  mirror:{name:'선반거울장',widths:[800],desc:'전신거울 + 선반'},
  corner:{name:'코너장',widths:[0],desc:'L자 선반, 앞쪽 오목한 곡선'}
};
const DEFAULT_PRICE={"hang1-800": 84500, "hang1-1000": 98500, "hang1-1200": 112500, "hang2-800": 91600, "hang2-1000": 106900, "hang2-1200": 122300, "hangShelf-800": 108000, "drawer3-800": 153300, "shelf5-800": 113300, "shelf5-400": 88700, "mirror-800": 149900, "corner-0": 128400};
const PRICE=Object.assign({},DEFAULT_PRICE);
try{Object.assign(PRICE,JSON.parse(document.getElementById('price-data').textContent||'{}'))}catch(e){}
if(!(window.claude&&window.claude.use)){try{Object.assign(PRICE,JSON.parse(localStorage.getItem('dressroom-prices')||'{}'))}catch(e){}}
const won=n=>n.toLocaleString('ko-KR')+'원';
const HANGERS=['hang2','hang1','hangShelf','drawer3'];
const SETS=[
  {g:'160cm',k:'A',top:[['hang1',800],['hang2',800]]},
  {g:'160cm',k:'B',top:[['drawer3',800],['hang2',800]]},
  {g:'160cm',k:'C',top:[['drawer3',800],['hang1',800]]},
  {g:'160cm',k:'D',top:[['hang2',800],['mirror',800]]},
  {g:'200cm',k:'E',top:[['hang2',1200],['hang1',800]]},
  {g:'200cm',k:'F',top:[['hang2',1200],['drawer3',800]]},
  {g:'200cm',k:'G',top:[['hang2',1200],['mirror',800]]},
  {g:'200cm',k:'H',top:[['hang2',1200],['hang2',800]]},
  {g:'224cm',k:'I',top:[['corner',0],['hang1',800],['hang2',800]]},
  {g:'224cm',k:'J',top:[['corner',0],['drawer3',800],['hang2',800]]},
  {g:'224cm',k:'K',top:[['mirror',800],['hang2',800],['corner',0]]},
  {g:'224cm',k:'L',top:[['hang2',800],['hang2',800],['corner',0]]},
  {g:'240cm',k:'M',top:[['hang1',800],['hang2',800],['drawer3',800]]},
  {g:'240cm',k:'N',top:[['mirror',800],['hang2',800],['hang1',800]]},
  {g:'240cm',k:'O',top:[['shelf5',800],['drawer3',800],['hang1',800]]},
  {g:'240cm',k:'P',top:[['hang2',1200],['hang1',1200]]},
  {g:'320cm',k:'Q',top:[['shelf5',800],['drawer3',800],['hang1',800],['hang2',800]]},
  {g:'320cm',k:'R',top:[['hang1',800],['drawer3',800],['mirror',800],['hang2',800]]},
  {g:'코너 L자',k:'coner 01',top:[['corner',0],['hang1',800],['hang2',800]],left:[['hang2',1200]]},
  {g:'코너 L자',k:'coner 02',top:[['corner',0],['hang1',800],['hang2',800]],left:[['mirror',800]]},
  {g:'코너 L자',k:'coner 03',top:[['corner',0],['drawer3',800],['hang2',800]],left:[['hang1',1200]]},
  {g:'코너 L자',k:'coner 04',top:[['corner',0],['hang1',800],['mirror',800]],left:[['hang2',800]]}
];
const modLen=([t,w])=>t==='corner'?CORNER:w+EXTRA;
const setLabel=st=>{const n=([t,w])=>t==='corner'?'코너장':`${w} ${TYPES[t].name}`;const tl=st.top.reduce((a,m)=>a+modLen(m),0);
  let x=`SET ${st.k}: ${st.top.map(n).join(' + ')}`;if(st.left){const ll=CORNER+st.left.reduce((a,m)=>a+modLen(m),0);x+=` / 옆벽 ${st.left.map(n).join(' + ')} (${fmt(tl)} × ${fmt(ll)}cm)`}else x+=` (${fmt(tl)}cm)`;return x};

let S={room:{w:3000,d:2400},pillar:'black',shelf:'oak',autoRot:true,items:[]};
let sel=null,nextId=1,hist=[],drag=null,guides=null;

const $=id=>document.getElementById(id);
const get=id=>S.items.find(i=>i.id===id);
const fmt=mm=>{const v=Math.round(mm)/10;return (Math.round(v*10)/10).toLocaleString('ko-KR',{maximumFractionDigits:1})};
const nameOf=it=>it.type==='corner'?'코너장':`${it.w} ${TYPES[it.type].name}`;
function fp(it){if(it.type==='corner')return{w:CORNER,h:CORNER};const W=it.w+EXTRA;return it.rot%180===0?{w:W,h:DEPTH}:{w:DEPTH,h:W}}

function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.room&&Array.isArray(s.items)){S=Object.assign(S,s);nextId=S.items.reduce((m,i)=>Math.max(m,i.id),0)+1}}catch(e){}}
function snapshot(){hist.push(JSON.stringify(S));if(hist.length>80)hist.shift()}
function undo(){if(!hist.length){toast('되돌릴 작업이 없어요');return}S=JSON.parse(hist.pop());if(sel&&!get(sel))sel=null;syncInputs();applyColors();buildRoom();refreshAll()}
let tt;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2800)}

function hits(a,b){const fa=fp(a),fb=fp(b);return a.x<b.x+fb.w-1&&a.x+fa.w>b.x+1&&a.y<b.y+fb.h-1&&a.y+fa.h>b.y+1}
function outside(a){const f=fp(a);return a.x<-1||a.y<-1||a.x+f.w>S.room.w+1||a.y+f.h>S.room.d+1}
function bad(a){return outside(a)||S.items.some(o=>o!==a&&hits(a,o))}
function clampIn(it){const f=fp(it);if(f.w<=S.room.w)it.x=Math.min(Math.max(it.x,0),S.room.w-f.w);if(f.h<=S.room.d)it.y=Math.min(Math.max(it.y,0),S.room.d-f.h)}

function findSpot(it){
  const RW=S.room.w,RD=S.room.d;
  if(it.type==='corner'){
    for(const r of [0,90,180,270]){it.rot=r;const f=fp(it);it.x=(r===90||r===180)?RW-f.w:0;it.y=(r===180||r===270)?RD-f.h:0;if(!bad(it))return true}
    it.rot=0;it.x=0;it.y=0;return false;
  }
  for(const r of [0,270,90,180]){
    it.rot=r;const f=fp(it);const along=r%180===0?RW-f.w:RD-f.h;

ntent||'{}'))}catch(e){}\nif(!(window.claude&&window.claude.use)){try{Object.assign(PRICE,JSON.parse(localStorage.getItem('dressroom-prices')||'{}'))}catch(e){}}\nconst won=n=>n.toLocaleString('ko-KR')+'원';\nconst HANGERS=['hang2','hang1','hangShelf','drawer3'];\nconst SETS=[\n  {g:'160cm',k:'A',top:[['hang1',800],['hang2',800]]},\n  {g:'160cm',k:'B',top:[['drawer3',800],['hang2',800]]},\n  {g:'160cm',k:'C',top:[['drawer3',800],['hang1',800]]},\n  {g:'160cm',k:'D',top:[['hang2',800],['mirror',800]]},\n  {g:'200cm',k:'E',top:[['hang2',1200],['hang1',800]]},\n  {g:'200cm',k:'F',top:[['hang2',1200],['drawer3',800]]},\n  {g:'200cm',k:'G',top:[['hang2',1200],['mirror',800]]},\n  {g:'200cm',k:'H',top:[['hang2',1200],['hang2',800]]},\n  {g:'224cm',k:'I',top:[['corner',0],['hang1',800],['hang2',800]]},\n  {g:'224cm',k:'J',top:[['corner',0],['drawer3',800],['hang2',800]]},\n  {g:'224cm',k:'K',top:[['mirror',800],['hang2',800],['corner',0]]},\n  {g:'224cm',k:'L',top:[['hang2',800],['hang2',800],['corner',0]]},\n  {g:'240cm',k:'M',top:[['hang1',800],['hang2',800],['drawer3',800]]},\n  {g:'240cm',k:'N',top:[['mirror',800],['hang2',800],['hang1',800]]},\n  {g:'240cm',k:'O',top:[['shelf5',800],['drawer3',800],['hang1',800]]},\n  {g:'240cm',k:'P',top:[['hang2',1200],['hang1',1200]]},\n  {g:'320cm',k:'Q',top:[['shelf5',800],['drawer3',800],['hang1',800],['hang2',800]]},\n  {g:'320cm',k:'R',top:[['hang1',800],['drawer3',800],['mirror',800],['hang2',800]]},\n  {g:'코너 L자',k:'coner 01',top:[['corner',0],['hang1',800],['hang2',800]],left:[['hang2',1200]]},\n  {g:'코너 L자',k:'coner 02',top:[['corner',0],['hang1',800],['hang2',800]],left:[['mirror',800]]},\n  {g:'코너 L자',k:'coner 03',top:[['corner',0],['drawer3',800],['hang2',800]],left:[['hang1',1200]]},\n  {g:'코너 L자',k:'coner 04',top:[['corner',0],['hang1',800],['mirror',800]],left:[['hang2',800]]}\n];\nconst modLen=([t,w])=>t==='corner'?CORNER:w+EXTRA;\nconst setLabel=st=>{const n=([t,w])=>t==='corner'?'코너장':`${w} ${TYPES[t].name}`;const tl=st.top.reduce((a,m)=>a+modLen(m),0);\n  let x=`SET ${st.k}: ${st.top.map(n).join(' + ')}`;if(st.left){const ll=CORNER+st.left.reduce((a,m)=>a+modLen(m),0);x+=` / 옆벽 ${st.left.map(n).join(' + ')} (${fmt(tl)} × ${fmt(ll)}cm)`}else x+=` (${fmt(tl)}cm)`;return x};\n\nlet S={room:{w:3000,d:2400},pillar:'black',shelf:'oak',autoRot:true,items:[]};\nlet sel=null,nextId=1,hist=[],drag=null,guides=null;\n\nconst $=id=>document.getElementById(id);\nconst get=id=>S.items.find(i=>i.id===id);\nconst fmt=mm=>{const v=Math.round(mm)/10;return (Math.round(v*10)/10).toLocaleString('ko-KR',{maximumFractionDigits:1})};\nconst nameOf=it=>it.type==='corner'?'코너장':`${it.w} ${TYPES[it.type].name}`;\nfunction fp(it){if(it.type==='corner')return{w:CORNER,h:CORNER};const W=it.w+EXTRA;return it.rot%180===0?{w:W,h:DEPTH}:{w:DEPTH,h:W}}\n\nfunction save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}\nfunction load(){try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.room&&Array.isArray(s.items)){S=Object.assign(S,s);nextId=S.items.reduce((m,i)=>Math.max(m,i.id),0)+1}}catch(e){}}\nfunction snapshot(){hist.push(JSON.stringify(S));if(hist.length>80)hist.shift()}\nfunction undo(){if(!hist.length){toast('되돌릴 작업이 없어요');return}S=JSON.parse(hist.pop());if(sel&&!get(sel))sel=null;syncInputs();applyColors();buildRoom();refreshAll()}\nlet tt;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2800)}\n\nfunction hits(a,b){const fa=fp(a),fb=fp(b);return a.x<b.x+fb.w-1&&a.x+fa.w>b.x+1&&a.y<b.y+fb.h-1&&a.y+fa.h>b.y+1}\nfunction outside(a){const f=fp(a);return a.x<-1||a.y<-1||a.x+f.w>S.room.w+1||a.y+f.h>S.room.d+1}\nfunction bad(a){return outside(a)||S.items.some(o=>o!==a&&hits(a,o))}\nfunction clampIn(it){const f=fp(it);if(f.w<=S.room.w)it.x=Math.min(Math.max(it.x,0),S.room.w-f.w);if(f.h<=S.room.d)it.y=Math.min(Math.max(it.y,0),S.room.d-f.h)}\n\nfunction findSpot(it){\n  const RW=S.room.w,RD=S.room.d;\n  if(it.type==='corner'){\n    for(const r of [0,90,180,270]){it.rot=r;const f=fp(it);it.x=(r===90||r===180)?RW-f.w:0;it.y=(r===180||r===270)?RD-f.h:0;if(!bad(it))return true}\n    it.rot=0;it.x=0;it.y=0;return false;\n  }\n  for(const r of [0,270,90,180]){\n    it.rot=r;const f=fp(it);const along=r%180===0?RW-f.w:RD-f.h;\n    const c=[0];S.items.forEach(o=>{const of=fp(o);c.push(r%180===0?o.x+of.w:o.y+of.h)});c.sort((a,b)=>a-b);\n    for(const v of c){if(v>along+0.5)continue;\n      if(r===0){it.x=v;it.y=0}else if(r===180){it.x=v;it.y=RD-f.h}else if(r===270){it.x=0;it.y=v}else{it.x=RW-f.w;it.y=v}\n      if(!bad(it))return true}\n  }\n  it.rot=0;const f=fp(it);it.x=Math.max(0,Math.round((RW-f.w)/2));it.y=Math.max(0,Math.round((RD-f.h)/2));return false;\n}\nfunction addModule(type,w){\n  snapshot();const it={id:nextId++,type,w,rot:0,x:0,y:0};const ok=findSpot(it);S.items.push(it);sel=it.id;refreshAll();\n  toast(ok?`추가했어요: ${nameOf(it)}`:'빈 벽 공간이 없어 방 가운데에 놓았어요. 끌어서 옮겨 주세요.');\n}\nfunction placeSet(idx){\n  const st=SETS[idx];if(!st)return;snapshot();\n  const had=S.items.length;S.items=[];const add=(type,w,rot,x,y)=>{const it={id:nextId++,type,w,rot,x,y};S.items.push(it);return it};\n  const topLen=st.top.reduce((a,m)=>a+modLen(m),0),cornerEnd=st.top[st.top.length-1][0]==='corner';\n  let x=cornerEnd?Math.max(0,S.room.w-topLen):0,last;\n  st.top.forEach(([t,w],i)=>{const rot=t==='corner'?(i===0?0:90):0;last=add(t,w,rot,x,0);x+=modLen([t,w])});\n  let leftLen=0;\n  if(st.left){let y=CORNER;st.left.forEach(([t,w])=>{last=add(t,w,270,0,y);y+=modLen([t,w])});leftLen=y}\n  sel=last.id;refreshAll();\n  const msgs=[];if(topLen>S.room.w)msgs.push(`위쪽 벽이 ${fmt(topLen-S.room.w)}cm 부족해요`);if(leftLen>S.room.d)msgs.push(`왼쪽 벽이 ${fmt(leftLen-S.room.d)}cm 부족해요`);\n  toast(`SET ${st.k}로 배치했어요. `+(msgs.length?msgs.join(', ')+'.':'방에 잘 들어가요.')+(had?' 이전 배치는 되돌리기로 복구할 수 있어요.':''));\n}\nfunction rotateSel(){const it=get(sel);if(!it)return;snapshot();const f0=fp(it),cx=it.x+f0.w/2,cy=it.y+f0.h/2;it.rot=(it.rot+90)%360;const f=fp(it);it.x=Math.round(cx-f.w/2);it.y=Math.round(cy-f.h/2);clampIn(it);refreshAll()}\nfunction deleteSel(){const it=get(sel);if(!it)return;snapshot();S.items=S.items.filter(i=>i!==it);sel=null;refreshAll();toast(`삭제했어요: ${nameOf(it)}`)}\nfunction dupSel(){const it=get(sel);if(!it)return;snapshot();const c={...it,id:nextId++};if(!findSpot(c)){c.rot=it.rot;c.x=it.x+100;c.y=it.y+100;clampIn(c)}S.items.push(c);sel=c.id;refreshAll();toast(`복제했어요: ${nameOf(c)}`)}\n\nfunction snapPos(it,x,y,thr){\n  const f=fp(it),RW=S.room.w,RD=S.room.d;let bx=null,by=null,dx=thr,dy=thr;\n  const tx=(v,line)=>{const d=Math.abs(v-x);if(d<dx){dx=d;bx={v,line}}};\n  const ty=(v,line)=>{const d=Math.abs(v-y);if(d<dy){dy=d;by={v,line}}};\n  tx(0,0);tx(RW-f.w,RW);ty(0,0);ty(RD-f.h,RD);\n  S.items.forEach(o=>{if(o.id===it.id)return;const of=fp(o);\n    const near=x<o.x+of.w+thr&&x+f.w>o.x-thr&&y<o.y+of.h+thr&&y+f.h>o.y-thr;if(!near)return;\n    tx(o.x+of.w,o.x+of.w);tx(o.x-f.w,o.x);tx(o.x,o.x);tx(o.x+of.w-f.w,o.x+of.w);\n    ty(o.y+of.h,o.y+of.h);ty(o.y-f.h,o.y);ty(o.y,o.y);ty(o.y+of.h-f.h,o.y+of.h);\n  });\n  let nx=bx?bx.v:x,ny=by?by.v:y;\n  if(f.w<=RW)nx=Math.min(Math.max(nx,0),RW-f.w);if(f.h<=RD)ny=Math.min(Math.max(ny,0),RD-f.h);\n  guides={x:bx?bx.line:null,y:by?by.line:null};\n  return{x:nx,y:ny};\n}\nfunction wallDist(r,px,py){return r===0?py:r===90?S.room.w-px:r===180?S.room.d-py:px}\nfunction autoRot(it,px,py){\n  if(it.type==='corner'){const L=px<S.room.w/2,T=py<S.room.d/2;return T?(L?0:90):(L?270:180)}\n  let best=it.rot,bd=Infinity;for(const r of [0,90,180,270]){const d=wallDist(r,px,py);if(d<bd){bd=d;best=r}}\n  if(bd>DEPTH+300)return it.rot;\n  if(best!==it.rot&&bd>wallDist(it.rot,px,py)-120)return it.rot;\n  return best;\n}\nfunction startDrag(it,px,py,src){snapshot();const f=fp(it);drag={id:it.id,off:{x:it.x+f.w/2-px,y:it.y+f.h/2-py},moved:false,src}}\nfunction moveDrag(px,py,thr){\n  const it=get(drag.id);if(!it)return;\n  if(S.au es(TYPES).flatMap(([t,d])=>d.widths.map(w=>[`${t}-${w}`,t==='corner'?'코너장':`${w} ${d.name}`]));\nfunction openAdmin(){\n  $('priceRows').innerHTML=priceKeys().map(([k,l])=>`<label class=\"prow\"><span>${l}<\/span><span><input type=\"number\" inputmode=\"numeric\" min=\"0\" step=\"100\" data-k=\"${k}\" value=\"${PRICE[k]??''}\"> 원<\/span><\/label>`).join('');\n  $('adminErr').textContent='';$('adminPanel').hidden=false;$('adminPanel').scrollIntoView({block:'nearest'});\n  $('priceRows').querySelector('input')?.focus();\n}\nfunction readAdmin(){\n  const out={};let bad=null;\n  $('priceRows').querySelectorAll('input').forEach(inp=>{const v=inp.value.trim(),n=Number(v);\n    const ok=v!==''&&Number.isInteger(n)&&n>=0&&n<=100000000;inp.setAttribute('aria-invalid',ok?'false':'true');\n    if(ok)out[inp.dataset.k]=n;else if(!bad)bad=inp});\n  if(bad){$('adminErr').textContent='단가는 0 이상의 정수(원)로 입력해 주세요.';bad.focus();return null}\n  return out;\n}\n$('priceRows').addEventListener('input',e=>{if(e.target.matches('input')){e.target.setAttribute('aria-invalid','false');$('adminErr').textContent=''}});\n$('adminBtn').onclick=()=>{$('adminPanel').hidden?openAdmin():($('adminPanel').hidden=true)};\n$('adminClose').onclick=()=>{$('adminPanel').hidden=true};\n$('adminReset').onclick=()=>{$('priceRows').querySelectorAll('input').forEach(i=>{i.value=DEFAULT_PRICE[i.dataset.k]??'';i.setAttribute('aria-invalid','false')});$('adminErr').textContent='';toast('기본 단가로 채웠어요. 저장해야 적용돼요.')};\n$('adminCopy').onclick=async()=>{const p=readAdmin();if(!p)return;const txt=JSON.stringify(p,null,2);\n  try{await navigator.clipboard.writeText(txt);toast('단가 JSON을 복사했어요')}catch(e){$('adminErr').textContent='복사하지 못했어요. 아래 내용을 직접 복사해 주세요: '+JSON.stringify(p)}};\n$('adminSave').onclick=async()=>{\n  const p=readAdmin();if(!p)return;\n  if(adminMode==='local'){try{localStorage.setItem('dressroom-prices',JSON.stringify(p))}catch(e){}Object.assign(PRICE,p);renderParts();$('adminPanel').hidden=true;toast('이 브라우저에 단가를 저장했어요');return}\n  if(adminMode!=='publish'||!artifactNs||!window.__TPL){$('adminErr').textContent='이 화면에서는 단가를 저장할 수 없어요.';return}\n  const btn=$('adminSave');btn.disabled=true;btn.textContent='저장 중…';\n  try{\n    const tpl=window.__TPL.replace(/(<script id=\"price-data\" type=\"application\\/json\">)[\\s\\S]*?(<\\/script>)/,(m,a,b)=>a+JSON.stringify(p)+b);\n    const selfJson=JSON.stringify(tpl).replace(/<\\//g,'<\\\\/').replace(/\\u2028/g,'\\\\u2028').replace(/\\u2029/g,'\\\\u2029');\n    const mark='window.__TPL='+'__SE'+'LF__;',mi=tpl.lastIndexOf(mark);if(mi<0)throw{code:'upstream_error'};\n    const html=tpl.slice(0,mi)+'window.__TPL='+selfJson+';'+tpl.slice(mi+mark.length);\n    save();await artifactNs.publish(html);\n    toast('단가를 저장했어요. 새 단가로 다시 불러와요.');\n  }catch(err){\n    const c=err&&err.code;btn.disabled=false;btn.textContent='저장하고 모두에게 적용';\n    if(c==='conflict'){$('adminErr').textContent='그 사이 새 버전이 게시됐어요. 페이지를 다시 불러온 뒤 한 번 더 저장해 주세요.'}\n    else if(c==='not_writer'||c==='not_granted'||c==='not_declared'||c==='consent_required'||c==='capability_disabled'||c==='capability_removed'){$('adminErr').textContent='이 화면은 읽기 전용이라 단가를 저장할 수 없어요.';$('adminBtn').hidden=true}\n    else if(c==='rate_limited'){$('adminErr').textContent='저장을 너무 자주 했어요. 잠시 후 다시 저장해 주세요.'}\n    else if(c==='too_large'){$('adminErr').textContent='페이지 용량이 커서 저장하지 못했어요.'}\n    else{$('adminErr').textContent='저장하지 못했어요. 잠시 후 다시 시도해 주세요.'}\n  }\n};\n(async function initAdmin(){\n  if(!(window.claude&&window.claude.use)){\n    if(/admin/.test(location.hash)){adminMode='local';$('adminBtn').hidden=false;$('adminCopy').hidden=false;\n      $('adminNote').textContent='이 브라우저에만 저장돼요. 고객 화면에 반영하려면 JSON 복사로 개발 담당자에게 전달해 주세요.'}\n    return;\n  }\n  try{\n    const [art,user]=await Promise.all([window.claude.use('artifact'),window.claude.use('user')]);\n    if(!art||!user)return;if(!(await user.canEdit()))return;\n    artifactNs=art;adminMode='publish';$('adminBtn').hidden=false;$('adm
